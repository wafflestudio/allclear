packages:
  - 'apps/*'

nodeLinker: hoisted
verifyDepsBeforeRun: false

overrides:
  'nanoid@<3.3.18': 3.3.18
  'next@15.5.24>postcss': 8.5.25
  'next@15.5.24>sharp': 0.35.4
  react-dom: 18.2.0

allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: false
  dooboolab-welcome: false
  esbuild: true
  protobufjs: true
  react-native-elements: false
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
