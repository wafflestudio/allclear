name: Deploy web to production

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - apps/web/**
      - apps/web-migrator/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - biome.json
      - .dockerignore
      - .github/workflows/_deploy-web.yml
      - .github/workflows/deploy-web-prod.yml
      - .github/gitops/allclear-prod-prisma-migrate.yaml
      - .github/scripts/update-gitops-web-with-migration.sh

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/_deploy-web.yml
    with:
      ocir_repository: allclear-prod/allclear-web
      gitops_overlay_path: argocd/allclear-prod
      run_prisma_migrations: true
    secrets:
      OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
      DEPLOYER_APP_PRIVATE_KEY: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
