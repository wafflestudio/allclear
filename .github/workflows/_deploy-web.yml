name: Deploy web image

on:
  workflow_call:
    inputs:
      ocir_repository:
        description: OCIR repository that receives the web image
        required: true
        type: string
      gitops_overlay_path:
        description: Kustomize overlay path in waffle-world-oci
        required: true
        type: string
      run_prisma_migrations:
        description: Add a Prisma PreSync Job to the production GitOps overlay
        required: false
        default: false
        type: boolean
    secrets:
      OCI_AUTH_TOKEN:
        required: true
      DEPLOYER_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and push web image
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy-${{ inputs.ocir_repository }}
      cancel-in-progress: true

    env:
      IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      OCIR_REGISTRY: yny.ocir.io
      OCIR_NAMESPACE: ax1dvc8vmenm
      OCIR_REPOSITORY: ${{ inputs.ocir_repository }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Login to OCIR
        run: echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login "$OCIR_REGISTRY" -u "$OCIR_NAMESPACE/members/waffle-deployer" --password-stdin

      - name: Build web image
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --platform linux/arm64 \
            --tag "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Validate Prisma migration runner
        run: |
          docker run --rm \
            --platform linux/arm64 \
            --workdir /app/prisma-migrator \
            --entrypoint /app/prisma-migrator/node_modules/.bin/prisma \
            "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:$IMAGE_TAG" \
            validate

      - name: Push web image
        run: docker push "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:$IMAGE_TAG"

      - name: Update GitOps image tag
        if: ${{ !inputs.run_prisma_migrations }}
        uses: wafflestudio/waffle-world-oci/.github/actions/update-image@main
        with:
          image: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}
          tag: ${{ env.IMAGE_TAG }}
          # The OCIR repository includes the service suffix, while the GitOps
          # overlay is rooted at the environment directory (for example, argocd/allclear-dev).
          overlay-path: ${{ inputs.gitops_overlay_path }}
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}

      - name: Generate GitOps App token
        if: ${{ inputs.run_prisma_migrations }}
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lijiSk5hqJhw5DsY
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
          owner: wafflestudio
          repositories: waffle-world-oci

      - name: Checkout GitOps repository
        if: ${{ inputs.run_prisma_migrations }}
        uses: actions/checkout@v7
        with:
          repository: wafflestudio/waffle-world-oci
          token: ${{ steps.gitops-token.outputs.token }}
          path: .gitops

      - name: Update production image and migration Job
        if: ${{ inputs.run_prisma_migrations }}
        env:
          GITOPS_OVERLAY_PATH: ${{ inputs.gitops_overlay_path }}
          WEB_IMAGE: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}
          WEB_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: bash .github/scripts/update-gitops-web-with-migration.sh
